services:
  spark-api:
    build: ./spark-api
    restart: unless-stopped
    environment:
      SUMMARY_WINDOW_SECONDS: ${SUMMARY_WINDOW_SECONDS:-120}
      SUMMARY_REFRESH_SECONDS: ${SUMMARY_REFRESH_SECONDS:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://radio.albertomunoz.ai}
      ASR_URL: ${ASR_URL:-}
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      AUDIO_ARCHIVE_DIR: ${AUDIO_ARCHIVE_DIR:-/data/drive-outbox}
      AUDIO_ARCHIVE_TIMEZONE: ${AUDIO_ARCHIVE_TIMEZONE:-America/Monterrey}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SPARK_API_PORT:-8010}:8000"
    volumes:
      - radio-data:/data
    networks:
      - default
      - youtube2knowledge

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - spark-api
    profiles:
      - tunnel

  drive-sync:
    image: rclone/rclone:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/drive-outbox
        while true; do
          rclone move /data/drive-outbox "$${DRIVE_REMOTE}:" \
            --config /config/rclone.conf \
            --drive-root-folder-id "$${DRIVE_FOLDER_ID}" \
            --checksum \
            --delete-empty-src-dirs
          sleep "$${DRIVE_SYNC_INTERVAL}"
        done
    environment:
      DRIVE_REMOTE: ${DRIVE_REMOTE:-knowledge-drive}
      DRIVE_FOLDER_ID: ${DRIVE_FOLDER_ID:-}
      DRIVE_SYNC_INTERVAL: ${DRIVE_SYNC_INTERVAL:-60}
    volumes:
      - ${RCLONE_CONFIG_PATH:-/home/alberto/.config/rclone/rclone.conf}:/config/rclone.conf:ro
      - radio-data:/data
    profiles:
      - drive

networks:
  youtube2knowledge:
    external: true
    name: youtube2knowledge_default

volumes:
  radio-data:
