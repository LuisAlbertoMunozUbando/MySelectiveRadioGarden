services:
  spark-api:
    build: ./spark-api
    restart: unless-stopped
    environment:
      SUMMARY_WINDOW_SECONDS: ${SUMMARY_WINDOW_SECONDS:-120}
      SUMMARY_REFRESH_SECONDS: ${SUMMARY_REFRESH_SECONDS:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://radio.albertomunoz.ai}
      ASR_URL: ${ASR_URL:-}
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SPARK_API_PORT:-8010}:8000"
    networks:
      - default
      - youtube2knowledge

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - spark-api
    profiles:
      - tunnel

networks:
  youtube2knowledge:
    external: true
    name: youtube2knowledge_default
